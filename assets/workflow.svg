polygon fill="#555555" points="289.7861,464.5977,293.7861,474.5977,297.7861,464.5977,293.7861,468.5977" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="293.7861" x2="293.7861" y1="510.5586" y2="530.5586"/><polygon fill="#555555" points="289.7861,520.5586,293.7861,530.5586,297.7861,520.5586,293.7861,524.5586" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="293.7861" x2="293.7861" y1="566.5195" y2="586.5195"/><polygon fill="#555555" points="289.7861,576.5195,293.7861,586.5195,297.7861,576.5195,293.7861,580.5195" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="752.5205" x2="752.5205" y1="638.5195" y2="658.5195"/><polygon fill="#555555" points="748.5205,648.5195,752.5205,658.5195,756.5205,648.5195,752.5205,652.5195" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="752.5205" x2="752.5205" y1="710.4414" y2="730.4414"/><polygon fill="#555555" points="748.5205,720.4414,752.5205,730.4414,756.5205,720.4414,752.5205,724.4414" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="752.5205" x2="752.5205" y1="782.3633" y2="802.3633"/><polygon fill="#555555" points="748.5205,792.3633,752.5205,802.3633,756.5205,792.3633,752.5205,796.3633" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="752.5205" x2="752.5205" y1="838.3242" y2="858.3242"/><polygon fill="#555555" points="748.5205,848.3242,752.5205,858.3242,756.5205,848.3242,752.5205,852.3242" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="752.5205" x2="752.5205" y1="894.2852" y2="914.2852"/><polygon fill="#555555" points="748.5205,904.2852,752.5205,914.2852,756.5205,904.2852,752.5205,908.2852" style="stroke:#555555;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="18" lengthAdjust="spacing" textLength="246.7705" x="159.2495" y="73.3926">pdf-to-obsidian   (input: a PDF)</text><text fill="#000000" font-family="'Segoe UI'" font-size="18" lengthAdjust="spacing" textLength="392.502" x="555.2695" y="73.3926">translate-markdown   (input: an English .md note)</text><g class="legend" data-source-line="48"><rect fill="#DDDDDD" height="140.3477" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="462.8467" x="484.3901" y="948.2852"/><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="122.5273" x="489.3901" y="968.3926">Both lanes write the</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="122.5957" x="615.7524" y="968.3926">same intermediate</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="168.8066" x="738.3481" y="968.3926">: blocks.jsonl, a list of typed</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="407.3809" x="489.3901" y="987.0137">blocks. What gets translated is decided there, by each block's own</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="77.9092" x="489.3901" y="1005.6348">translatable</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="322.3008" x="571.1343" y="1005.6348">flag - set by the segmenter that produced the block:</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="452.8467" x="489.3901" y="1024.2559">MinerU's block types on the PDF side, Markdown syntax on the note side.</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="382.9287" x="489.3901" y="1042.877">That is why translating a PDF's note through its work directory</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="4.2246" x="489.3901" y="1061.498">(</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" text-decoration="line-through" textLength="125.166" x="493.6147" y="1061.498">stage translate, then</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="259.2803" x="622.6157" y="1061.498">stage render) keeps the finer typing, while</text><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="247.5156" x="489.3901" y="1080.1191">re-segmenting a finished note does not.</text></g><!--SRC=[jLLDRnit4BtlhnWa1ykgLgdJf43a8gs_10I9NQEnaQANW5hExhBQ9HSaPNa3__Y-uKgoREJGInQ282qVtxoPUKCUq1VdbsNZrkHAYZLJN3iAIzCqOKf_iTNiQMrYFIFgLcr3AWIEuTLwisigBxC3-iXT9CltaQ9BD1LRzYgofXqqt5KKXbLjLELLIo6gFf3dEnFKek4fcAx-lBcOaNPa7HXLoqysZFx05Xz5oM-o-FvmHjUDil7syXCYhHejS4jhRoA3RG2bqCQ6o4fBdlkI9gHisZJaj_Qgwv2pvyxv66X-yk7JnVaqor0JswaakbRQhOsjg5HDuBqLpQLQDN7kRBmIvIy-S-MORZ-ys0ETUE_MPwvndbw-JS_-OX7DdOdzgVEe_0RrQtg-WpetgdLM_p_mgIgMbNShgpV8UNhsa5SkylTGv_EVdwFs8vwzEtlzxcGFSOqEcMYSVG8xISyUxCR4XgLMdyqtfgEtMHRb3Tti73WXPvdOLiRoZDOrUoP5r-Vpr3D5byelqGehNW5E5JLLBiiUNbwSpt-PdpvqkioZozqY61Z84j48mLTnDh0SFcJ9JTaCWW9JJfS8v6_fpVG-aoZvUsgDrWr__JSuEvKl-ebCgoeEnzcirVGAeNsh6iaWXvtzgeWhpnCgl0iXzrn2iosO6cENoASq5PPbjGiPw1UDAvOXCJUWRZcgz4VOyHkSlLjv-WVvUGUIXLU-dn33TwJyt-OE2iua5289d_XOYd4Gg4CCHYD4gYbf5BsoeL7I5vHKTyxOI8MpWoJz- -4mEQEUms56DDlY9J6FmGb3WPDYq4lPoqPLAOrlDNGKgXFoh_WZunT1je2RC7Wu4_OJFSwI_f5rQB2dFBSktqLx4bkqmWgOI9t5sWJ2HrBSD6VR_noaFRLECwYjDcKsyyFHbJ-jCFP8TQQjHe7ls9kotskRQgYekP0-yRt1y1_1VxJmRebKt2h2ESTmZEl4OlCtyoDORASxRxTct7EPfGjRDIRKX90fzAFdMlrwq2OAk6ePxTYsZnRzexb3RwEwV-uM9F0ZE_IZ2zWmRWXDtbHrHCTFNQm9vpY7uUXEbHYFWvoYKCU-PKnmvF5uzaGGJczCHOZfzkh59hHTfo-rYhY786DNA2q6qbmOpUdCbqb5gP-N3IJZyNQJN4pZSQfawbIK7I9lqpGKAKeap9jU5GFlG3O3pt2YW3QzIHg356NhOfnCqF2irrj0ie8Wfc2waI2GlwxxNK9o2QMZ304IEDOukwkQfFXoo-7Yz5n4vtimZF8StgluiHwJOUQtxuUU7zAIkHi6hHJveXgH9WXj6WQHvtoJ_200A7YS1uVZxkQaPYgpEFJvFm00]--></g></svg>