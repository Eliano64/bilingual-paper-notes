just="spacing" textLength="212.332" x="323.9375" y="411.5859">this is the PDF -&gt; Markdown-only mode</text><polygon fill="#FFFFFF" points="293.7861,430.5977,305.7861,442.5977,293.7861,454.5977,281.7861,442.5977,293.7861,430.5977" style="stroke:#666666;stroke-width:0.5;"/><rect fill="#FFFFFF" height="35.9609" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="190.7949" x="198.3887" y="474.5977"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="170.7949" x="208.3887" y="497.5469">render - blocks.jsonl -&gt; note.md</text><rect fill="#FFFFFF" height="35.9609" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="284.5039" x="151.5342" y="530.5586"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="264.5039" x="161.5342" y="553.5078">verify - structural checks, exits 1 on broken output</text><ellipse cx="293.7861" cy="597.5195" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="293.7861" cy="597.5195" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="53.9688" y2="936.2852"/><rect fill="#F4F1FB" height="882.3164" style="stroke:#F4F1FB;stroke-width:1;" width="402.502" x="550.2695" y="53.9688"/><ellipse cx="752.5205" cy="628.5195" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="51.9219" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="295.2793" x="604.8809" y="658.5195"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="275.2793" x="614.8809" y="681.4688">md2blocks - segment the note by Markdown syntax</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="77.2148" x="614.8809" y="697.4297">-&gt; blocks.jsonl</text><rect fill="#FFFFFF" height="51.9219" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="272.9375" x="616.0518" y="730.4414"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="207.2988" x="626.0518" y="753.3906">translate - reads each block's own flags</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="252.9375" x="626.0518" y="769.3516">-&gt; zh / caption_zh written back into blocks.jsonl</text><rect fill="#FFFFFF" height="35.9609" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="190.7949" x="657.123" y="802.3633"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="170.7949" x="667.123" y="825.3125">render - blocks.jsonl -&gt; note.md</text><rect fill="#FFFFFF" height="35.9609" rx="12.5" ry="12.5" style="stroke:#666666;stroke-width:0.5;" width="284.5039" x="610.2686" y="858.3242"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="264.5039" x="620.2686" y="881.2734">verify - structural checks, exits 1 on broken output</text><ellipse cx="752.5205" cy="925.2852" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="752.5205" cy="925.2852" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="550.2695" x2="550.2695" y1="53.9688" y2="936.2852"/><line style="stroke:#000000;stroke-width:1.5;" x1="952.7715" x2="952.7715" y1="53.9688" y2="936.2852"/><line style="stroke:#555555;stroke-width:1;" x1="293.7861" x2="293.7861" y1="102.9102" y2="122.9102"/><polygon fill="#555555" points="289.7861,112.9102,293.7861,122.9102,297.7861,112.9102,293.7861,116.9102" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="293.7861" x2="293.7861" y1="174.832" y2="194.832"/><polygon fill="#555555" points="289.7861,184.832,293.7861,194.832,297.7861,184.832,293.7861,188.832" style="stroke:#555555;stroke-widt